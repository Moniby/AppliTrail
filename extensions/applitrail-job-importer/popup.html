<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AppliTrail Job Importer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand"><img src="icon.png" alt="" /><strong>AppliTrail</strong><span class="version">v1.1.5</span></div>
      <p class="eyebrow">JOB IMPORTER</p>
      <h1>Save this opportunity</h1>
      <p id="status">Review the job details in AppliTrail before anything is saved.</p>
      <button id="capture" type="button">Capture &amp; review in AppliTrail</button>
      <p class="note">AppliTrail reads only the tab you choose. It never submits an application for you.</p>
    </main>
    <script src="extract-job-posting.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
