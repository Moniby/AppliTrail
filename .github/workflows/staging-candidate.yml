name: Prepare staging candidate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: staging-candidate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    name: Build approved main revision for staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build release candidate
        env:
          APPLITRAIL_ENVIRONMENT: staging
          APPLITRAIL_RELEASE: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: npm run build

      - name: Record candidate summary
        run: |
          echo "## Staging candidate ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: \`${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Production has not been changed." >> "$GITHUB_STEP_SUMMARY"
